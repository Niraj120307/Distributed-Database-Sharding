
services:

  shard1:
    image: mysql:8.0
    container_name: shard-node-1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: shard_db
    ports:
      - "3307:3306"
    volumes:
      - shard1_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  shard2:
    image: mysql:8.0
    container_name: shard-node-2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: shard_db
    ports:
      - "3308:3306"
    volumes:
      - shard2_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  shard3:
    image: mysql:8.0
    container_name: shard-node-3
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: shard_db
    ports:
      - "3309:3306"
    volumes:
      - shard3_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro


  shard4:
    image: mysql:8.0
    container_name: shard-node-4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: shard_db
    ports:
      - "3311:3306"
    volumes:
      - shard4_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  metadata:
    image: mysql:8.0
    container_name: shard-metadata-node
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cluster_metadata
    ports:
      - "3310:3306"
    volumes:
      - metadata_data:/var/lib/mysql
      - ./sql/metadata_init.sql:/docker-entrypoint-initdb.d/metadata_init.sql:ro

volumes:
  shard1_data:
  shard2_data:
  shard3_data:
  shard4_data:
  metadata_data:
